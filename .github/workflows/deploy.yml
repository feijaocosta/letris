name: Deploy no GitHub Pages

# Faz o build e publica o site no branch gh-pages (que o GitHub Pages já serve)
# a cada push na main. Também pode ser rodado manualmente pela aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # necessário para enviar o build ao branch gh-pages

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publicar no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "deploy: ${{ github.sha }}"
